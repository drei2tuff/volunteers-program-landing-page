<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — Bayanihang QC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: #f5f7fa;
      font-family: system-ui, -apple-system, sans-serif;
      color: #111;
      text-align: center;
    }

    .coming-soon__logo {
      width: clamp(80px, 14vw, 120px);
      height: auto;
      margin-bottom: 32px;
    }

    .coming-soon__eyebrow {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 18px;
      background: #c8102e;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
    }

    .coming-soon__title {
      margin-bottom: 16px;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      line-height: 1.1;
      color: #003087;
    }

    .coming-soon__title span {
      color: #c8102e;
    }

    .coming-soon__description {
      max-width: 480px;
      margin: 0 auto 36px;
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.6;
      color: #444;
    }

    .coming-soon__back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: #003087;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      transition: transform .18s ease, filter .18s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .coming-soon__back:hover {
        transform: translateY(-2px);
        filter: brightness(1.15);
      }
    }

    .coming-soon__back:focus-visible {
      outline: 3px solid #003087;
      outline-offset: 3px;
    }

    .coming-soon__footer {
      margin-top: 48px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <img class="coming-soon__logo" src="assets/0e4aa.png" alt="Bayanihang QC">

  <span class="coming-soon__eyebrow">Registration Opening Soon</span>

  <h1 class="coming-soon__title">
    Palarong Pambansa<br>
    <span>2027 Volunteers</span>
  </h1>

  <p class="coming-soon__description">
    The volunteer registration portal for Palarong Pambansa 2027 is on its way.
    Check back soon — we'll announce the opening date shortly.
  </p>

  <a class="coming-soon__back" href="/">
    ← Back to Bayanihang QC
  </a>

  <p class="coming-soon__footer">
    Bayanihang QC &mdash; Quezon City Volunteer Program
  </p>
</body>
</html>
